<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{主题}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{{HEAD}}
<script>
/*
  主题切换：默认跟随系统，用户点过按钮之后记在 localStorage 里。
  这段必须放在 <head> 里，否则深色模式会闪白。
*/
(function () {
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略即可 */ }
})();
</script>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<script>
(function () {
  document.addEventListener('contextmenu', function (event) {
    event.preventDefault();
  }, true);
  document.addEventListener('keydown', function (event) {
    var key = (event.key || '').toLowerCase();
    var modifier = event.ctrlKey || event.metaKey;
    var toolsShortcut = modifier && event.shiftKey && ['i', 'j', 'c'].indexOf(key) !== -1;
    var macShortcut = event.metaKey && event.altKey && ['i', 'j', 'c'].indexOf(key) !== -1;
    if (key === 'f12' || toolsShortcut || macShortcut || (modifier && key === 'u')) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
})();
</script>
</head>
<body class="page-{{BODYCLASS}}">
<a class="skip-link" href="#main">跳到正文</a>
{{HEADER}}
<main id="main" class="wrap{{MAIN_CLASS}}">
{{BODY}}
</main>
{{FOOTER}}
<script src="{{ROOT}}assets/theme.js" defer></script>
{{SCRIPTS}}
</body>
</html>
