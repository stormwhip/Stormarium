<article class="note{{笔记附加类}}" id="note-root" data-default-view="{{默认视图}}">
  <header class="note-head">
    <div class="note-title-row">
      <h1 class="note-title">{{笔记标题}}</h1>
{{原生预览}}
    </div>
    <p class="note-meta">
      <span class="meta-modified">最后修改 {{最后修改}}</span>
{{标签行}}
    </p>
{{视图切换}}
  </header>

{{下载按钮}}

{{Markdown视图}}
{{PDF视图}}
</article>

<button id="to-top" class="to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <span class="to-top-arrow" aria-hidden="true">↑</span>
  <span class="to-top-text">顶部</span>
</button>
