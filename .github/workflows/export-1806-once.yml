name: Temporary MIT 18.06 source export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-1806-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/upload-artifact@v4
        with:
          name: mit1806-source-files
          path: |
            内容/数学/MIT 18.06 Linear Algebra 笔记/latex/*.tex
            内容/数学/MIT 18.06 Linear Algebra 笔记/pdf/*.pdf
          if-no-files-found: error
          retention-days: 1
