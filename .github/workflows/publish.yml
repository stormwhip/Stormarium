name: 发布网站

on:
  push:
    branches: [main]
    paths:
      - '内容/**'
      - '站点素材/**'
      - '站点配置.json'
      - '工具/**'
      - '服务/**'
      - '.github/workflows/publish.yml'
      - '.github/deploy/pack.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stormarium-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 验证工具交互与安全检查
        run: |
          set -euo pipefail
          node --check 工具/build.js
          node --check 工具/模板/assets/note.js
          node --check 工具/模板/assets/tool.js
          node 工具/tests/tool-ui.test.js
          PYTHONPATH=服务 python3 -m unittest discover -s 服务/tests -p 'test_*.py'
          python3 -m compileall -q 服务
      - name: 生成网站
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          # 保持各篇笔记的更新时间，避免每次检出都把它们变成当天。
          while IFS= read -r -d '' file; do
            date=$(git log -1 --format=%ct -- "$file")
            if [[ -n "$date" ]]; then touch -d "@$date" -- "$file"; fi
          done < <(git ls-files -z -- 内容)
          node 工具/build.js
          node 工具/tests/download-links.test.js
          test -s 网站/index.html
          test -s 网站/sitemap.xml
          test -s 网站/search.html
          test -s 网站/tools/english.html
          test -z "$(find 网站 服务 -type l -print -quit)"
      - name: 生成发布包
        run: |
          set -euo pipefail
          payload=$(mktemp -d)
          trap 'rm -rf -- "$payload"' EXIT
          mv 网站 "$payload/site"
          mkdir -p "$payload/service/prompts" "$payload/service/templates"
          cp 服务/*.py 服务/requirements.txt "$payload/service/"
          cp 服务/prompts/*.py 服务/prompts/*.md "$payload/service/prompts/"
          cp 服务/templates/*.tex "$payload/service/templates/"
          python3 .github/deploy/pack.py "$GITHUB_SHA" "$payload/site" "$payload/service" release
          SITE_DIR="$payload/site" CHECK_RELEASE_ASSETS=1 node 工具/tests/download-links.test.js
          # 与服务器发布接收器使用同一份白名单，发布前拒绝任何非许可文件。
          python3 - <<'PY'
          import importlib.util
          import tarfile
          from pathlib import PurePosixPath
          spec = importlib.util.spec_from_file_location("release_receiver", ".github/deploy/receive.py")
          receiver = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(receiver)
          with tarfile.open("release/stormarium.tar.gz", "r:gz") as archive:
              rejected = [
                  member.name for member in archive
                  if not member.isdir() and (
                      not member.isreg()
                      or not receiver.allowed(PurePosixPath(member.name).parts)
                  )
              ]
          if rejected:
              raise SystemExit("发布包包含不符合服务器白名单的文件：" + ", ".join(rejected[:20]))
          print("发布包白名单校验通过")
          PY
      - name: 在 GitHub 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="site-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --draft=false --latest
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --draft \
              --title "网站发布 ${GITHUB_SHA:0:7}" --notes "Stormarium 网站发布包。"
            gh release edit "$tag" --draft=false --latest
          fi
      - name: 核对线上文件与本次 GitHub 发布版本
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ["EXPECTED_SHA"]
          base = "https://stormwhip.com"
          headers = {"User-Agent": "Stormarium-version-check/1.0",
                     "Cache-Control": "no-cache", "Pragma": "no-cache"}
          for attempt in range(36):
              suffix = "?release_check=" + expected + "-" + str(attempt)
              try:
                  request = urllib.request.Request(
                      base + "/stormarium-version.txt" + suffix, headers=headers)
                  with urllib.request.urlopen(request, timeout=12) as response:
                      version = response.read(100).decode("ascii").strip()
                  request = urllib.request.Request(
                      base + "/notes/chemistry/prep2-chemistry.html" + suffix, headers=headers)
                  with urllib.request.urlopen(request, timeout=12) as response:
                      page = response.read(300000).decode("utf-8", errors="replace")
                  if version == expected and "raw.githubusercontent.com/stormwhip/Stormarium/" + expected in page:
                      print("线上版本与 GitHub 发布一致：" + expected, flush=True)
                      break
                  print("线上尚未同步：版本=" + version[:50] +
                        "；笔记下载链接匹配=" +
                        str("raw.githubusercontent.com/stormwhip/Stormarium/" + expected in page),
                        flush=True)
              except (urllib.error.URLError, OSError, UnicodeError) as error:
                  print("线上验证请求失败：" + str(error)[:180], flush=True)
              if attempt != 35:
                  time.sleep(10)
          else:
              raise SystemExit("线上版本未与 GitHub Release 同步，请检查 stormarium-sync.service 与 CDN 缓存")
          PY
      - name: 诊断线上域名的 HTML 和脚本缓存
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import urllib.error
          import urllib.request
          for host in ("stormwhip.com", "www.stormwhip.com"):
              print("\nDOMAIN:", host, flush=True)
              for suffix in (
                  "/",
                  "/?storm_diag=4992f44",
                  "/assets/theme.js",
                  "/assets/theme.js?storm_diag=4992f44",
                  "/stormarium-version.txt",
              ):
                  url = "https://" + host + suffix
                  req = urllib.request.Request(url, headers={"User-Agent": "Stormarium-deploy-check/1.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read(750000)
                          content = body.decode("utf-8", errors="replace")
                          scripts = re.findall(r'<script[^>]+src="([^"]*theme\.js[^"]*)"', content)
                          print({
                              "path": suffix,
                              "status": response.status,
                              "final": response.url,
                              "bytes": len(body),
                              "sha256": hashlib.sha256(body).hexdigest()[:16],
                              "cache_age": response.headers.get("Age"),
                              "cache_status": response.headers.get("X-Cache"),
                              "script_ref": scripts[:2],
                              "has_right_click_listener": "contextmenu" in content,
                              "has_f12_listener": "key === 'f12'" in content,
                              "version": content.strip()[:42] if suffix.startswith("/stormarium-version") else None,
                          }, flush=True)
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      print({"path": suffix, "error": str(exc)[:180]}, flush=True)
          PY
