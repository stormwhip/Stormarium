name: 发布网站

on:
  push:
    branches: [main]
    paths:
      - '内容/**'
      - '站点素材/**'
      - '站点配置.json'
      - '工具/**'
      - '服务/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stormarium-production
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 生成网站
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          # 保持各篇笔记的更新时间，避免每次检出都把它们变成当天。
          while IFS= read -r -d '' file; do
            date=$(git log -1 --format=%ct -- "$file")
            if [[ -n "$date" ]]; then touch -d "@$date" -- "$file"; fi
          done < <(git ls-files -z -- 内容)
          node 工具/build.js
          test -s 网站/index.html
          test -s 网站/sitemap.xml
          test -s 网站/search.html
          test -s 网站/tools/english.html
          test -z "$(find 网站 服务 -type l -print -quit)"
      - name: 生成发布包
        run: |
          set -euo pipefail
          payload=$(mktemp -d)
          trap 'rm -rf -- "$payload"' EXIT
          mv 网站 "$payload/site"
          mkdir "$payload/service"
          cp -a 服务/*.py 服务/prompts 服务/templates 服务/requirements.txt "$payload/service/"
          printf '%s\n' "$GITHUB_SHA" > "$payload/site/stormarium-version.txt"
          tar -C "$payload" -czf stormarium.tar.gz site service
      - name: 在 GitHub 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="site-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" stormarium.tar.gz --clobber
            gh release edit "$tag" --draft=false --latest
          else
            gh release create "$tag" stormarium.tar.gz --target "$GITHUB_SHA" \
              --title "网站发布 ${GITHUB_SHA:0:7}" --notes "Stormarium 网站发布包。" --latest
          fi
